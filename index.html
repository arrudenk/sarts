<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SARTS ▸ poster.exe</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Silkscreen:wght@400;700&family=Pirata+One&display=swap">
<style>
  :root{
    /* Hello Kitty, але темніша: сливове чорнило замість чорного */
    --cream:#ffe9f1;
    --cream-2:#ffd6e6;
    --paper:#fff4f8;
    --pink:#ff4d96;
    --pink-hot:#ff1f77;
    --yellow:#ffd84d;
    --blue:#7fd2ff;
    --ink:#2b1b2b;
    --plum:#4a1f3d;
    --void:#1b0f1a;

    --lit:#ffffff;
    --mid:#e2a9c3;
    --dark:#b8749a;
    --edge:#6e3a58;

    --ui:"VT323",ui-monospace,monospace;
    --px:"Silkscreen",ui-monospace,monospace;
    --goth:"Pirata One",serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--void);color:var(--ink);
    font:400 17px/1.25 var(--ui);
    display:flex;flex-direction:column;overflow:hidden;
    -webkit-font-smoothing:none;
  }

  /* фаски: світло зверху-зліва, тінь знизу-справа. Без радіусів, без переходів. */

  /* ---------- титульний бар ---------- */
  #bar{
    flex:none;display:flex;align-items:center;gap:10px;
    padding:4px 6px;background:var(--cream);
    border-bottom:2px solid var(--edge);
  }
  #bar .grab{
    flex:1;display:flex;align-items:center;gap:10px;min-width:0;
    padding:3px 10px;
    background:linear-gradient(90deg,var(--pink-hot) 0%,var(--pink) 45%,var(--blue) 100%);
    border:2px solid;border-color:var(--lit) var(--edge) var(--edge) var(--lit);
  }
  #bar .ttl{
    font-family:var(--goth);font-size:23px;color:#fff;letter-spacing:.02em;
    text-shadow:2px 2px 0 var(--plum);white-space:nowrap;
  }
  #bar .sub{
    font-family:var(--px);font-size:9px;color:#fff;opacity:.85;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  #bar .sticker{
    font-family:var(--px);font-size:9px;color:var(--ink);background:var(--yellow);
    border:2px solid var(--ink);padding:2px 6px;transform:rotate(-4deg);white-space:nowrap;
  }
  .caps{display:flex;gap:3px;flex:none}
  .caps i{
    width:18px;height:18px;display:block;
    border:2px solid;border-color:var(--lit) var(--edge) var(--edge) var(--lit);
  }
  .caps i:nth-child(1){background:var(--yellow)}
  .caps i:nth-child(2){background:var(--blue)}
  .caps i:nth-child(3){background:var(--pink-hot)}

  #main{flex:1;display:flex;min-height:0}

  /* ---------- сцена ---------- */
  #stage{
    flex:1;min-width:0;display:grid;place-items:center;padding:28px;overflow:hidden;
    background:
      repeating-linear-gradient(0deg,rgba(255,77,150,.05) 0 1px,transparent 1px 4px),
      radial-gradient(circle at 50% 35%,#2d1a2a 0%,var(--void) 72%);
  }
  #frame{
    position:relative;isolation:isolate;
    max-width:100%;max-height:100%;line-height:0;
    border:2px solid;border-color:var(--edge) var(--lit) var(--lit) var(--edge);
    box-shadow:0 0 0 2px var(--plum),6px 6px 0 rgba(0,0,0,.45);
  }
  #frame.empty{
    /* висота веде, ширина йде за нею — інакше 4/5 вилазить за екран */
    height:min(100%,760px);width:auto;aspect-ratio:4/5;
    display:grid;place-items:center;line-height:1.5;cursor:pointer;
    /* шахматка старого редактора */
    background:
      conic-gradient(var(--cream) 0 25%,var(--cream-2) 0 50%,var(--cream) 0 75%,var(--cream-2) 0)
      0 0/22px 22px;
  }
  #frame.drop{box-shadow:0 0 0 2px var(--yellow),6px 6px 0 rgba(0,0,0,.45)}
  #hint{
    font-family:var(--px);font-size:11px;line-height:2.2;color:var(--plum);text-align:center;
    background:var(--paper);border:2px solid var(--ink);padding:14px 18px;
    box-shadow:4px 4px 0 var(--pink);
  }
  #hint b{display:block;font-size:13px;color:var(--pink-hot)}
  #photo{display:block;max-width:100%;max-height:calc(100vh - 130px);object-fit:contain}
  #frame.empty #photo,#frame.empty .layer{display:none}

  .layer{
    position:absolute;white-space:pre;cursor:grab;
    line-height:1.05;user-select:none;touch-action:none;
  }
  .layer:active{cursor:grabbing}
  .layer::after{
    content:"";position:absolute;inset:-8px;border:1px dashed transparent;pointer-events:none;
  }
  .layer:hover::after{border-color:rgba(255,216,77,.8)}
  #t-title{transform:translate(-50%,-50%);text-align:center}
  #t-caption{transform:translate(-100%,-50%);text-align:right}

  /* ---------- панель ---------- */
  #panel{
    width:368px;flex:none;background:var(--cream);
    border-left:2px solid var(--edge);
    display:flex;flex-direction:column;min-height:0;
  }
  #scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:8px}
  #scroll::-webkit-scrollbar{width:16px}
  #scroll::-webkit-scrollbar-track{background:var(--cream-2)}
  #scroll::-webkit-scrollbar-thumb{
    background:var(--pink);border:2px solid;border-color:var(--lit) var(--edge) var(--edge) var(--lit);
  }

  .sec{
    background:var(--paper);padding:10px 12px 14px;margin-bottom:8px;
    border:2px solid;border-color:var(--lit) var(--edge) var(--edge) var(--lit);
  }
  .sec>h2{
    margin:-10px -12px 12px;padding:4px 8px;
    font-family:var(--px);font-size:9px;letter-spacing:.06em;color:var(--paper);
    background:var(--plum);text-transform:uppercase;font-weight:400;
    display:flex;justify-content:space-between;
  }
  .sec>h2::after{content:"▚▚";opacity:.5}

  .row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .row>label{flex:none;width:108px;color:var(--plum);font-size:16px;line-height:1.05}
  .row>.ctl{flex:1;min-width:0;display:flex;align-items:center;gap:6px}

  textarea,select,input[type=text]{
    width:100%;background:var(--lit);color:var(--ink);font:inherit;outline:none;
    padding:3px 6px;border:2px solid;border-color:var(--edge) var(--lit) var(--lit) var(--edge);
  }
  textarea{resize:vertical;min-height:54px;line-height:1.3}
  select{appearance:none;cursor:pointer;padding-right:26px;
    background-image:
      linear-gradient(45deg,transparent 50%,var(--plum) 50%),
      linear-gradient(135deg,var(--plum) 50%,transparent 50%),
      linear-gradient(var(--cream-2),var(--cream-2));
    background-position:calc(100% - 14px) calc(50% - 1px),calc(100% - 10px) calc(50% - 1px),right 2px center;
    background-size:5px 5px,5px 5px,18px calc(100% - 4px);
    background-repeat:no-repeat}
  select:focus,textarea:focus,input[type=text]:focus{outline:2px solid var(--blue);outline-offset:0}
  select option{background:var(--lit);font-size:16px}

  input[type=range]{
    -webkit-appearance:none;appearance:none;flex:1;height:14px;background:var(--cream-2);
    border:2px solid;border-color:var(--edge) var(--lit) var(--lit) var(--edge);outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:12px;height:16px;background:var(--pink);
    border:2px solid;border-color:var(--lit) var(--edge) var(--edge) var(--lit);
  }
  input[type=range]:active::-webkit-slider-thumb{background:var(--yellow)}
  .num{
    flex:none;width:40px;text-align:right;font-size:16px;color:var(--plum);
    background:var(--cream-2);padding:0 3px;
    border:2px solid;border-color:var(--edge) var(--lit) var(--lit) var(--edge);
  }

  input[type=color]{
    -webkit-appearance:none;appearance:none;flex:none;width:30px;height:24px;padding:0;
    background:none;cursor:pointer;
    border:2px solid;border-color:var(--lit) var(--edge) var(--edge) var(--lit);
  }
  input[type=color]::-webkit-color-swatch-wrapper{padding:1px}
  input[type=color]::-webkit-color-swatch{border:none}

  input[type=checkbox]{
    -webkit-appearance:none;appearance:none;margin:0;width:16px;height:16px;cursor:pointer;
    background:var(--lit);border:2px solid;border-color:var(--edge) var(--lit) var(--lit) var(--edge);
  }
  input[type=checkbox]:checked{
    background:var(--pink-hot);box-shadow:inset 0 0 0 2px var(--lit);
  }

  button{
    font:400 17px/1 var(--ui);color:var(--ink);background:var(--cream);cursor:pointer;
    padding:7px 10px;
    border:2px solid;border-color:var(--lit) var(--edge) var(--edge) var(--lit);
    box-shadow:inset -1px -1px 0 var(--dark);
  }
  button:hover{background:var(--cream-2)}
  button:active:not(:disabled){
    border-color:var(--edge) var(--lit) var(--lit) var(--edge);
    box-shadow:inset 1px 1px 0 var(--dark);padding:8px 9px 6px 11px;
  }
  button.primary{background:var(--pink);color:#fff;font-family:var(--px);font-size:11px;padding:10px}
  button.primary:hover{background:var(--pink-hot)}
  button.primary:active:not(:disabled){padding:11px 9px 9px 11px}
  button:disabled{color:var(--dark);text-shadow:1px 1px 0 var(--lit);cursor:default}
  button.primary:disabled{background:var(--cream-2);color:var(--dark)}
  .btns{display:flex;gap:6px;padding:0 8px 8px}
  .btns>*{flex:1}
  .dice{flex:none!important;width:44px;font-size:20px}

  .tabs{display:flex;gap:3px;margin:-10px -12px 12px;padding:4px 4px 0;background:var(--plum)}
  .tabs button{
    flex:1;font-family:var(--px);font-size:9px;padding:6px 4px;
    background:var(--cream-2);color:var(--plum);box-shadow:none;
    border-color:var(--lit) var(--edge) transparent var(--lit);
  }
  .tabs button.on{background:var(--paper);color:var(--pink-hot);padding-bottom:8px;margin-bottom:-2px}
  .tabs button:active:not(:disabled){padding:6px 4px;border-color:var(--lit) var(--edge) transparent var(--lit)}
  .pane{display:none}
  .pane.on{display:block}

  /* ---------- статус-бар ---------- */
  #status{
    flex:none;display:flex;align-items:center;gap:8px;
    font-family:var(--px);font-size:9px;color:var(--plum);
    background:var(--cream);border-top:2px solid var(--lit);padding:5px 8px;
  }
  #status span{
    padding:3px 6px;background:var(--cream-2);
    border:2px solid;border-color:var(--edge) var(--lit) var(--lit) var(--edge);
  }
  #status .grow{flex:1;background:none;border:none}
  .blink{animation:bl 1.06s steps(1,end) infinite}
  @keyframes bl{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.blink{animation:none}}
</style>
</head>
<body>

<div id="bar">
  <div class="grab">
    <span class="ttl">Sarts</span>
    <span class="sub">poster.exe — [untitled.psd]</span>
    <span class="sticker">no cloud ✦ no acc</span>
  </div>
  <div class="caps"><i></i><i></i><i></i></div>
</div>

<div id="main">
  <div id="stage">
    <div id="frame" class="empty">
      <img id="photo" alt="">
      <div id="hint"><b>↯ drop image ↯</b>перетягни · клікни · ⌘V</div>
      <div class="layer" id="t-title"></div>
      <div class="layer" id="t-caption"></div>
    </div>
  </div>

  <aside id="panel">
    <div id="scroll">
      <div class="sec">
        <div class="tabs">
          <button data-tab="title" class="on">Заголовок</button>
          <button data-tab="caption">Підпис</button>
        </div>

        <div class="pane on" data-pane="title"></div>
        <div class="pane" data-pane="caption"></div>
      </div>

      <div class="sec">
        <h2>Фото</h2>
        <div class="row"><label>Затемнення</label><div class="ctl">
          <input type="range" id="dim" min="0" max="80" value="0"><span class="num" id="dim-n">0</span>
        </div></div>
        <div class="row"><label>Контраст</label><div class="ctl">
          <input type="range" id="contrast" min="60" max="180" value="100"><span class="num" id="contrast-n">100</span>
        </div></div>
        <div class="row"><label>Зерно</label><div class="ctl">
          <input type="range" id="grain" min="0" max="60" value="0"><span class="num" id="grain-n">0</span>
        </div></div>
      </div>
    </div>

    <div class="btns">
      <button id="load">Відкрити фото…</button>
      <button class="dice" id="dice" title="Випадкова пара шрифтів">⚄</button>
    </div>
    <div class="btns">
      <button class="primary" id="save" disabled>▣ Зберегти PNG</button>
    </div>
  </aside>
</div>

<div id="status">
  <span id="st-doc">нема документа</span>
  <span id="st-pos">— × —</span>
  <span class="grow"></span>
  <span>100% ▾</span>
  <span class="blink">█</span>
</div>

<input type="file" id="file" accept="image/*" hidden>

<script>
/* ---------------------------------------------------------------- fonts */
// headline: найгучніше з того, що зараз у ротації
const HEAD_FONTS = [
  ['Instrument Serif',      '400,1'],
  ['Bricolage Grotesque',   '200..800'],
  ['Unbounded',             '200..900'],
  ['Syne',                  '400..800'],
  ['Anton',                 '400'],
  ['Archivo Black',         '400'],
  ['Big Shoulders Display', '100..900'],
  ['Bodoni Moda',           '400..900,1'],
  ['DM Serif Display',      '400,1'],
  ['Space Grotesk',         '300..700'],
  ['Gabarito',              '400..900'],
  ['Playfair Display',      '400..900,1'],
  ['Oswald',                '200..700'],
  ['Gloock',                '400'],
  ['Italiana',              '400'],
  ['Zen Dots',              '400'],
  ['Rubik Mono One',        '400'],
  ['Monoton',               '400'],
  ['Climate Crisis',        '400'],
  ['Cormorant Garamond',    '300..700,1'],
];

// caption: навмисно різні настрої — мото, рукопис, термінал, піксель, готика
const CAP_FONTS = [
  ['JetBrains Mono',      '100..800,1'],
  ['Space Mono',          '400,1'],
  ['IBM Plex Mono',       '300,1'],
  ['Courier Prime',       '400,1'],
  ['Major Mono Display',  '400'],
  ['Syne Mono',           '400'],
  ['VT323',               '400'],
  ['Silkscreen',          '400'],
  ['Doto',                '100..900'],
  ['Caveat',              '400..700'],
  ['Homemade Apple',      '400'],
  ['Nanum Pen Script',    '400'],
  ['Shadows Into Light',  '400'],
  ['La Belle Aurore',     '400'],
  ['Rock Salt',           '400'],
  ['Inter',               '100..900'],
  ['Archivo',             '100..900'],
  ['Tektur',              '400..900'],
  ['Pirata One',          '400'],
  ['Italiana',            '400'],
  ['Instrument Serif',    '400,1'],
  ['Cormorant Garamond',  '300..700,1'],
];

// один <link> на родину: якщо Google відмовить одній — решта все одно приїде
function loadFonts(){
  const seen = new Set();
  for (const [name, spec] of [...HEAD_FONTS, ...CAP_FONTS]) {
    if (seen.has(name)) continue;
    seen.add(name);
    const [w, ital] = spec.split(',');
    const fam = name.replace(/ /g, '+');
    const axis = ital
      ? `:ital,wght@0,${w.replace('..', '..')};1,${w}`
      : (w === '400' ? '' : `:wght@${w}`);
    const l = document.createElement('link');
    l.rel = 'stylesheet';
    l.href = `https://fonts.googleapis.com/css2?family=${fam}${axis}&display=swap`;
    document.head.appendChild(l);
  }
}
loadFonts();

const BLENDS = ['normal','multiply','screen','overlay','difference','exclusion',
                'color-dodge','hard-light','soft-light','luminosity','hue','saturation','color'];

/* ---------------------------------------------------------------- state */
const S = {
  title: {
    text:'SARTS', font:'Cormorant Garamond', size:28, weight:100, italic:false,
    track:-8, line:100, color:'#ffffff', blend:'normal',
    glow:'#5effc8', glowSize:0, opacity:100, x:50, y:12,
    locked:true,
  },
  caption: {
    text:'001 / reykjavík', font:'JetBrains Mono', size:2.4, weight:400, italic:false,
    track:12, line:140, color:'#ffffff', blend:'normal',
    glow:'#ff3e8f', glowSize:0, opacity:100, x:94, y:92,
  },
};

/* ------------------------------------------------------------- controls */
const FIELDS = [
  {k:'text',   t:'area',  l:'Текст'},
  {k:'font',   t:'font',  l:'Шрифт'},
  {k:'size',   t:'range', l:'Розмір',   min:0.5, max:28, step:0.1, suf:''},
  {k:'weight', t:'range', l:'Жирність', min:100, max:900, step:100},
  {k:'track',  t:'range', l:'Трекінг',  min:-8,  max:60,  step:1},
  {k:'line',   t:'range', l:'Інтерліньяж', min:70, max:200, step:1},
  {k:'italic', t:'check', l:'Курсив'},
  {k:'color',  t:'color', l:'Колір'},
  {k:'blend',  t:'blend', l:'Накладення'},
  {k:'glow',   t:'color', l:'Світіння'},
  {k:'glowSize',t:'range',l:'Сила',     min:0, max:60, step:1},
  {k:'opacity',t:'range', l:'Прозорість',min:0, max:100, step:1},
];

function buildPane(which){
  const pane = document.querySelector(`[data-pane="${which}"]`);
  const st = S[which];
  const fonts = which === 'title' ? HEAD_FONTS : CAP_FONTS;

  if (which === 'title'){
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<label>Стиль</label><div class="ctl"><span style="font-family:var(--px);font-size:9px;color:#fff;background:var(--pink-hot);border:2px solid var(--ink);padding:3px 6px">✦ зафіксовано ✦</span></div>`;
    pane.append(row);
  }

  for (const f of FIELDS){
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<label>${f.l}</label>`;
    const ctl = document.createElement('div');
    ctl.className = 'ctl';

    if (f.t === 'area'){
      row.style.alignItems = 'flex-start';
      const ta = document.createElement('textarea');
      ta.value = st.text;
      ta.oninput = () => { st.text = ta.value; render(which); };
      ctl.append(ta);
    }
    else if (f.t === 'font'){
      const sel = document.createElement('select');
      for (const [name] of fonts){
        const o = new Option(name, name, false, name === st.font);
        o.style.fontFamily = `"${name}"`;
        sel.add(o);
      }
      sel.onchange = () => { st.font = sel.value; render(which); };
      sel.style.fontFamily = `"${st.font}"`;
      sel.dataset.bind = 'font';
      sel.oninput = () => sel.style.fontFamily = `"${sel.value}"`;
      ctl.append(sel);
    }
    else if (f.t === 'blend'){
      const sel = document.createElement('select');
      for (const b of BLENDS) sel.add(new Option(b, b, false, b === st.blend));
      sel.onchange = () => { st.blend = sel.value; render(which); };
      ctl.append(sel);
    }
    else if (f.t === 'color'){
      const inp = document.createElement('input');
      inp.type = 'color'; inp.value = st[f.k];
      const hex = document.createElement('input');
      hex.type = 'text'; hex.value = st[f.k]; hex.style.fontSize = '15px';
      inp.oninput = () => { st[f.k] = hex.value = inp.value; render(which); };
      hex.oninput = () => { if(/^#[0-9a-f]{6}$/i.test(hex.value)){ st[f.k] = inp.value = hex.value; render(which);} };
      ctl.append(inp, hex);
    }
    else if (f.t === 'check'){
      const inp = document.createElement('input');
      inp.type = 'checkbox'; inp.checked = st[f.k];
      inp.onchange = () => { st[f.k] = inp.checked; render(which); };
      ctl.append(inp);
    }
    else {
      const r = document.createElement('input');
      r.type = 'range'; r.min = f.min; r.max = f.max; r.step = f.step; r.value = st[f.k];
      const n = document.createElement('span');
      n.className = 'num'; n.textContent = st[f.k];
      r.oninput = () => { st[f.k] = parseFloat(r.value); n.textContent = r.value; render(which); };
      ctl.append(r, n);
    }
    row.append(ctl);
    pane.append(row);
  }
}
buildPane('title'); buildPane('caption');

function applyLock(){
  const pane = document.querySelector('[data-pane="title"]');
  pane.querySelectorAll('input,select,textarea').forEach(el => {
    el.disabled = true;
    el.closest('.row').style.opacity = .3;
  });
  EL.title.style.cursor = 'default';
}

document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.dataset.pane === b.dataset.tab));
});

/* --------------------------------------------------------------- render */
const frame = document.getElementById('frame');
const photo = document.getElementById('photo');
const EL = { title: document.getElementById('t-title'), caption: document.getElementById('t-caption') };

function render(which){
  for (const k of (which ? [which] : ['title','caption'])){
    const st = S[k], el = EL[k];
    const base = photo.clientWidth || frame.clientWidth || 600;
    const px = base * st.size / 100;

    el.textContent = st.text;
    el.style.fontFamily    = `"${st.font}", serif`;
    el.style.fontSize      = px + 'px';
    el.style.fontWeight    = st.weight;
    el.style.fontStyle     = st.italic ? 'italic' : 'normal';
    el.style.letterSpacing = (st.track / 100) + 'em';
    el.style.lineHeight    = (st.line / 100);
    el.style.color         = st.color;
    el.style.mixBlendMode  = st.blend;
    el.style.opacity       = st.opacity / 100;
    el.style.left          = st.x + '%';
    el.style.top           = st.y + '%';
    const g = st.glowSize / 100 * px;
    el.style.textShadow = g > 0
      ? `0 0 ${g}px ${st.glow}, 0 0 ${g*2.2}px ${st.glow}, 0 0 ${g*4}px ${st.glow}`
      : 'none';
  }
}

/* grain — одна невеличка текстура, запікається раз, не на кожен кадр */
let grainURL = null;
function makeGrain(){
  const n = 160, c = document.createElement('canvas');
  c.width = c.height = n;
  const ctx = c.getContext('2d'), d = ctx.createImageData(n, n);
  for (let i = 0; i < d.data.length; i += 4){
    const v = (Math.random() * 255) | 0;
    d.data[i] = d.data[i+1] = d.data[i+2] = v; d.data[i+3] = 255;
  }
  ctx.putImageData(d, 0, 0);
  grainURL = c.toDataURL();
}
makeGrain();

const PH = { dim:0, contrast:100, grain:0 };
for (const k of Object.keys(PH)){
  const r = document.getElementById(k), n = document.getElementById(k + '-n');
  r.oninput = () => { PH[k] = +r.value; n.textContent = r.value; applyPhoto(); };
}
function applyPhoto(){
  photo.style.filter = `contrast(${PH.contrast}%) brightness(${100 - PH.dim}%)`;
  frame.style.setProperty('--grain', PH.grain / 100);
  let g = document.getElementById('grain-layer');
  if (!g){
    g = document.createElement('div'); g.id = 'grain-layer';
    g.style.cssText = 'position:absolute;inset:0;pointer-events:none;background-size:160px 160px;mix-blend-mode:overlay';
    g.style.backgroundImage = `url(${grainURL})`;
    frame.insertBefore(g, EL.title);
  }
  g.style.opacity = PH.grain / 100;
}

/* ----------------------------------------------------------- drag layers */
for (const k of ['title','caption']){
  EL[k].addEventListener('pointerdown', e => {
    if (S[k].locked) return;
    e.preventDefault();
    EL[k].setPointerCapture(e.pointerId);
    const r = photo.getBoundingClientRect();
    const move = ev => {
      S[k].x = Math.max(0, Math.min(100, (ev.clientX - r.left) / r.width * 100));
      S[k].y = Math.max(0, Math.min(100, (ev.clientY - r.top) / r.height * 100));
      document.getElementById('st-pos').textContent = `${S[k].x|0} × ${S[k].y|0}`;
      render(k);
    };
    const up = () => { EL[k].removeEventListener('pointermove', move); EL[k].removeEventListener('pointerup', up); };
    EL[k].addEventListener('pointermove', move);
    EL[k].addEventListener('pointerup', up);
  });
}

/* ----------------------------------------------------------------- photo */
const file = document.getElementById('file');
document.getElementById('load').onclick = () => file.click();
frame.addEventListener('click', e => { if (frame.classList.contains('empty')) file.click(); });
file.onchange = () => file.files[0] && setPhoto(file.files[0]);

['dragenter','dragover'].forEach(t => frame.addEventListener(t, e => { e.preventDefault(); frame.classList.add('drop'); }));
['dragleave','drop'].forEach(t => frame.addEventListener(t, e => { e.preventDefault(); frame.classList.remove('drop'); }));
frame.addEventListener('drop', e => {
  const f = [...e.dataTransfer.files].find(f => f.type.startsWith('image/'));
  if (f) setPhoto(f);
});
addEventListener('paste', e => {
  const f = [...(e.clipboardData?.files || [])].find(f => f.type.startsWith('image/'));
  if (f) setPhoto(f);
});

function setPhoto(f){
  const url = URL.createObjectURL(f);
  photo.onload = () => {
    URL.revokeObjectURL(url);           // блоб більше не потрібен — картинка вже декодована
    frame.classList.remove('empty');
    document.getElementById('hint').style.display = 'none';
    document.getElementById('save').disabled = false;
    document.getElementById('st-doc').textContent = `${photo.naturalWidth} × ${photo.naturalHeight} px`;
    applyPhoto(); render();
  };
  photo.src = url;
}
new ResizeObserver(() => render()).observe(frame);

/* ------------------------------------------------------------------ dice */
const pick = a => a[(Math.random() * a.length) | 0];
document.getElementById('dice').onclick = () => {
  if (!S.title.locked){
    S.title.font  = pick(HEAD_FONTS)[0];
    S.title.blend = pick(BLENDS);
  }
  S.caption.font  = pick(CAP_FONTS)[0];
  S.caption.blend = pick(BLENDS);
  document.querySelectorAll('select').forEach(s => {
    const which = s.closest('.pane').dataset.pane;
    if (s.dataset.bind === 'font'){ s.value = S[which].font; s.style.fontFamily = `"${s.value}"`; }
    else s.value = S[which].blend;
  });
  render();
};

/* ---------------------------------------------------------------- export */
document.getElementById('save').onclick = async () => {
  const btn = document.getElementById('save');
  btn.disabled = true; btn.textContent = '◴ Рендер…';

  const W = photo.naturalWidth, H = photo.naturalHeight;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');

  ctx.filter = `contrast(${PH.contrast}%) brightness(${100 - PH.dim}%)`;
  ctx.drawImage(photo, 0, 0, W, H);
  ctx.filter = 'none';

  if (PH.grain > 0){
    const gi = new Image(); gi.src = grainURL; await gi.decode();
    const pat = ctx.createPattern(gi, 'repeat');
    ctx.save();
    ctx.globalCompositeOperation = 'overlay';
    ctx.globalAlpha = PH.grain / 100;
    ctx.fillStyle = pat; ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  for (const k of ['title','caption']){
    const st = S[k];
    if (!st.text.trim()) continue;
    const px = W * st.size / 100;
    const font = `${st.italic?'italic ':''}${st.weight} ${px}px "${st.font}"`;
    await document.fonts.load(font, st.text);

    ctx.save();
    ctx.font = font;
    if ('letterSpacing' in ctx) ctx.letterSpacing = (px * st.track / 100) + 'px';
    ctx.fillStyle = st.color;
    ctx.globalAlpha = st.opacity / 100;
    ctx.globalCompositeOperation = st.blend === 'normal' ? 'source-over' : st.blend;
    ctx.textAlign = k === 'title' ? 'center' : 'right';
    ctx.textBaseline = 'alphabetic';

    const lines = st.text.split('\n');
    const lh = px * st.line / 100;
    const x = W * st.x / 100;
    const g = st.glowSize / 100 * px;

    // CSS центрує блок line box'ів, не em-квадрат: повторюємо half-leading, інакше текст тікає вгору
    const m = ctx.measureText('Hg');
    const asc  = m.fontBoundingBoxAscent  ?? px * 0.8;
    const desc = m.fontBoundingBoxDescent ?? px * 0.2;
    const blockTop = H * st.y / 100 - lines.length * lh / 2;
    const first = blockTop + (lh - (asc + desc)) / 2 + asc;

    const draw = () => lines.forEach((ln, i) => ctx.fillText(ln, x, first + i * lh));
    if (g > 0){
      ctx.shadowColor = st.glow;
      for (const m of [4, 2.2, 1]){ ctx.shadowBlur = g * m; draw(); }
      ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
    }
    draw();
    ctx.restore();
  }

  c.toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'poster.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);   // канвас-блоб висить у памʼяті, поки не відпустиш
    btn.disabled = false; btn.textContent = '▣ Зберегти PNG';
  }, 'image/png');
};

applyLock();
document.fonts.ready.then(() => render());
render();
</script>
</body>
</html>
